# 연구 공통 설정. 수집 스크립트(scraping/)와 이후 분석 코드가 모두 이 파일을 읽어.

sample:
  start_date: "2023-01-01"   # 표본 시작일 (Kalshi 시리즈 대부분이 2023년부터 거래)
  end_date: "2026-11-04"     # 표본 종료일

kalshi:
  base_url: "https://api.elections.kalshi.com/trade-api/v2"
  # 연구 대상 시리즈. 이름이 바뀌었을 수 있으니 01_kalshi.py가 저장하는
  # data/raw/kalshi/series_list.csv 를 보고 확인·수정해.
  series:
    - KXCPI        # headline CPI
    - KXCPICORE    # core CPI
    - KXGDP        # GDP
    - KXU3         # 실업률
    - KXPAYROLLS   # 비농업 고용 (수집 가능 여부 확인용)
  period_interval: 1440      # 캔들 간격(분). 1440 = 일봉
  request_sleep_sec: 0.15    # 요청 간 대기 (기본 등급 초당 10회 제한 대비)

forexfactory:
  currency: "USD"
  # 수집할 이벤트 이름에 포함된 키워드 (대소문자 무시)
  event_keywords:
    - "CPI"
    - "GDP"
    - "Unemployment Rate"
    - "PPI"
    - "Non-Farm"
  request_sleep_sec: 3.0     # 사이트 부하를 줄이기 위한 대기

alfred:
  # ALFRED(FRED 과거 vintage) 시리즈 ID
  series:
    CPIAUCSL: "CPI 지수 (계절조정)"
    CPILFESL: "Core CPI 지수 (계절조정)"
    A191RL1Q225SBEA: "실질 GDP 성장률 (전기 대비 연율)"
    UNRATE: "실업률"
    PPIFIS: "PPI 최종수요 (계절조정)"

rates_fred:
  series:
    DGS2: "미국채 2년 수익률"
    DGS10: "미국채 10년 수익률"

ecos:
  base_url: "https://ecos.bok.or.kr/api"
  stat_code: "817Y002"                 # 시장금리(일별). 확인 필요
  item_name_contains: "국고채(2년)"     # 항목 이름으로 코드를 자동 탐색

clean_kalshi:
  # 방법은 Diercks, Katz & Wright (2026) 공개 코드를 따름 (src/clean/kalshi_dkw.py)
  price_method: "last"          # last: 그날 마지막 체결가(원본 기본) | mid: 호가 중간값(원본 부록 A 비교용)
  monotone_method: "middle-out" # 원본 기본. 강건성: right-to-left, left-to-right
  max_spread: 0.20              # mid 사용 시 호가 차이가 이보다 크면 제외 (내 설정, 원본에 없음)
  series:
    # strike_int: 기준선 간격 (원본 인자). null이면 간격이 불규칙해서 빈 기준선 채우기를 하지 않음
    # moment_adjustment: 기준선 값 → 실제 발표치 값 보정 (원본 인자, "x 초과"는 x+0.1부터)
    # days_before_horizon: 만기 전 며칠까지 분포를 남길지 (원본 CPI·실업률 설정 30일)
    KXCPI:      {strike_int: 0.1,  moment_adjustment: 0.1,  days_before_horizon: 30}
    KXCPICORE:  {strike_int: 0.1,  moment_adjustment: 0.1,  days_before_horizon: 30}
    KXU3:       {strike_int: 0.1,  moment_adjustment: 0.1,  days_before_horizon: 30}
    # 아래 두 시리즈는 원본 논문의 발표 단위 분석에 없음 → 설정은 내 판단
    KXGDP:      {strike_int: null, moment_adjustment: 0.1,  days_before_horizon: 30}
    KXPAYROLLS: {strike_int: null, moment_adjustment: 1000, days_before_horizon: 30}

event_panel:
  horizons: [7, 1]              # 발표 며칠 전 Kalshi 분포를 쓸지 (연구설계 h)
  max_stale_days: 3             # 목표일 이전 가장 가까운 관측일이 이보다 오래되면 결측 처리 (내 설정)
  sigma_min_obs: 12             # σ 계산에 필요한 최소 과거 발표 수 (내 설정)
  # 코로나 시기는 고용·실업률 서프라이즈를 6~7배 키워 σ를 왜곡해서 σ 계산에서 제외 (내 판단, 근거 문헌 없음)
  sigma_exclude: ["2020-03-01", "2020-12-31"]
