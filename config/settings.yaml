# 연구 공통 설정. 수집 스크립트(scraping/)와 이후 분석 코드가 모두 이 파일을 읽어.

sample:
  start_date: "2023-01-01"   # 표본 시작일 (Kalshi 시리즈 대부분이 2023년부터 거래)
  end_date: "2026-11-04"     # 표본 종료일

kalshi:
  base_url: "https://api.elections.kalshi.com/trade-api/v2"
  # 연구 대상 시리즈. 이름이 바뀌었을 수 있으니 01_kalshi.py가 저장하는
  # data/raw/kalshi/series_list.csv 를 보고 확인·수정해.
  series:
    - KXCPI        # headline CPI
    - KXCPICORE    # core CPI
    - KXGDP        # GDP
    - KXU3         # 실업률
  period_interval: 1440      # 캔들 간격(분). 1440 = 일봉
  request_sleep_sec: 0.15    # 요청 간 대기 (기본 등급 초당 10회 제한 대비)

forexfactory:
  currency: "USD"
  # 수집할 이벤트 이름에 포함된 키워드 (대소문자 무시)
  event_keywords:
    - "CPI"
    - "GDP"
    - "Unemployment Rate"
    - "PPI"
    - "Non-Farm"
  request_sleep_sec: 3.0     # 사이트 부하를 줄이기 위한 대기

alfred:
  # ALFRED(FRED 과거 vintage) 시리즈 ID
  series:
    CPIAUCSL: "CPI 지수 (계절조정)"
    CPILFESL: "Core CPI 지수 (계절조정)"
    A191RL1Q225SBEA: "실질 GDP 성장률 (전기 대비 연율)"
    UNRATE: "실업률"
    PPIFIS: "PPI 최종수요 (계절조정)"

rates_fred:
  series:
    DGS2: "미국채 2년 수익률"
    DGS10: "미국채 10년 수익률"

ecos:
  base_url: "https://ecos.bok.or.kr/api"
  stat_code: "817Y002"                 # 시장금리(일별). 확인 필요
  item_name_contains: "국고채(2년)"     # 항목 이름으로 코드를 자동 탐색
